name: Daily Charlotte forecast

on:
  schedule:
    # 07:17 UTC, about 3:17am in Charlotte, before the day's weather has happened.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: charlotte-almanac
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write today's almanac
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: ${{ vars.ZAI_MODEL || 'glm-4.7-flash' }}
        run: python -m src.main

      - name: Record the prediction in the log
        run: |
          git config user.name "almanac-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/predictions.jsonl data/normals.json data/upstream.json data/nwp.json
          if git diff --cached --quiet; then
            echo "Prediction log already current."
          else
            git commit -m "log: forecast for $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    name: Keep the schedule enabled
    needs: build
    if: always()
    runs-on: ubuntu-latest
    # GitHub disables a cron workflow after 60 days without repository activity.
    # Its own job, so only this token can reach the Actions API, and its own
    # inline call, so no third-party action has to be allowed on this repo.
    permissions:
      actions: write
    steps:
      - name: Re-enable the schedule if GitHub turned it off
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error --fail-with-body\
            --request PUT\
            --header "Authorization: Bearer ${GH_TOKEN}"\
            --header "Accept: application/vnd.github+json"\
            --header "X-GitHub-Api-Version: 2022-11-28"\
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/enable"
          echo "Schedule enabled."
